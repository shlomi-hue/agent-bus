services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent_bus
      POSTGRES_PASSWORD: agent_bus
      POSTGRES_DB: agent_bus
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_bus -d agent_bus"]
      interval: 5s
      timeout: 5s
      retries: 10
